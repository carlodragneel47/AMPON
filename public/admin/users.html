<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users | Ampon Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages/portal.css">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/pages/admin/users.js"></script>
</head>
<body class="portal">
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Admin navigation"></aside>
    <div class="shell-overlay"></div>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main class="content stack" id="content">
        <section class="stats" id="stats" aria-label="Account totals"></section>
        <div class="toolbar" style="margin-bottom:0">
          <div class="segmented" role="radiogroup" aria-label="Filter by role" id="role-filter">
            <label><input type="radio" name="role" value="all" checked><span>All accounts</span></label>
            <label><input type="radio" name="role" value="adopter"><span>Adopters</span></label>
            <label><input type="radio" name="role" value="admin"><span>Administrators</span></label>
          </div>
          <div class="input-wrap"><svg class="icon"><use href="/img/icons.svg#i-search"></use></svg><input type="search" id="q" placeholder="Search name or email" aria-label="Search users"></div>
        </div>
        <section class="card card-pad">
          <div class="table-wrap" id="users-table"><div class="spinner"></div></div>
        </section>
      </main>
      <footer class="portal-foot"></footer>
    </div>
  </div>
</body>
</html>
