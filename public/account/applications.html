<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Applications | Ampon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/pages/portal.css">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <script type="module" src="/js/pages/account/applications.js"></script>
</head>
<body class="portal">
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Account navigation"></aside>
    <div class="shell-overlay"></div>
    <div class="workspace">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content">
        <div class="toolbar">
          <div class="segmented" role="radiogroup" aria-label="Filter applications" id="filter">
            <label><input type="radio" name="f" value="all" checked><span>All</span></label>
            <label><input type="radio" name="f" value="pending"><span>Pending</span></label>
            <label><input type="radio" name="f" value="approved"><span>Approved</span></label>
            <label><input type="radio" name="f" value="closed"><span>Closed</span></label>
          </div>
          <a class="btn btn-primary btn-sm" href="/pets"><svg class="icon"><use href="/img/icons.svg#i-plus"></use></svg>New application</a>
        </div>
        <div class="stack" id="list"><div class="spinner"></div></div>
      </main>
      <footer class="portal-foot"></footer>
    </div>
  </div>
</body>
</html>
